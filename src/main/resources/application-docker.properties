# ============================================
# Docker Environment Configuration
# ============================================

spring.application.name=SIMs

#spring.profiles.active=docker

# Server Configuration
server.port=8080
server.servlet.context-path=/api
server.forward-headers-strategy=framework
spring.web.resources.add-mappings=false
spring.mvc.static-path-pattern=/static-only/**

# Database Configuration (will be overridden by environment variables)
spring.datasource.url=jdbc:postgresql://postgres:5432/syte_db
spring.datasource.username=syte_user
spring.datasource.password=syte_pwd

# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Disable named query validation during startup
spring.jpa.properties.hibernate.query.validate_named_queries=false
spring.jpa.properties.hibernate.query.ignore_named_query_check=true

# Keycloak Configuration
keycloak.auth-server-url=https://192.168.8.102:8180
keycloak.realm=SIMs
keycloak.resource=sims_backend
keycloak.public-client=false
keycloak.bearer-only=true
keycloak.ssl-required=external

# Keycloak Admin Client Configuration
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Keycloak Configuration - ALL must use the same external URL
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://192.168.8.102:8180/realms/SIMs/protocol/openid-connect/certs

# Add this to ensure proper issuer validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://192.168.8.102:8180/realms/SIMs

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost,http://localhost:3000,https://172.20.10.5,https://192.168.8.102:8180,http://192.168.8.102:8180}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# SpringDoc/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.cache.disabled=true
springdoc.packages-to-scan=com.quadrah.sims.controller
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.doc-expansion=none

# Logging Configuration
logging.level.root=INFO
logging.level.com.quadrah.sims=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log file configuration
logging.file.name=/app/logs/application.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true

# Async Configuration
spring.task.execution.pool.core-size=3
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
